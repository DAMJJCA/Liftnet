spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # --- Supabase pooler: evitar conexiones obsoletas y fallar rápido ---
      keepalive-time: 30000         # ping activo cada 30s para mantener conexiones vivas
      max-lifetime: 600000          # recicla conexiones a los 10 min (antes del timeout de Supabase)
      minimum-idle: 1
      maximum-pool-size: 5          # apropiado para Supabase free tier
      connection-timeout: 8000      # 8s máximo para obtener conexión del pool → falla rápido
      validation-timeout: 3000      # 3s para detectar conexiones muertas con SELECT 1
      connection-test-query: SELECT 1  # evita prepared statements internos del JDBC isValid()

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:

  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
