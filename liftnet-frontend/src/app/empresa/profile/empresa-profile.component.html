<div class="profile-container" >

  <h2>Perfil de la empresa</h2>

  <form (ngSubmit)="save()" #f="ngForm">

    <div class="form-group">
      <label>Nombre de la empresa</label>
      <input
        name="nombreEmpresa"
        [(ngModel)]="profile.nombreEmpresa"
        required
      />
    </div>

    <div class="form-group">
      <label>Ubicación</label>
      <input
        name="ubicacion"
        [(ngModel)]="profile.ubicacion"
      />
    </div>

    <div class="form-group">
      <label>Teléfono</label>
      <input
        name="telefono"
        [(ngModel)]="profile.telefono"
      />
    </div>

    <div class="form-group">
      <label>Descripción</label>
      <textarea
        name="descripcion"
        [(ngModel)]="profile.descripcion"
        rows="4"
      ></textarea>
    </div>

    <button type="submit" [disabled]="f.invalid">
      Guardar cambios
    </button>
  </form>

  <p *ngIf="successMessage" class="success">
    {{ successMessage }}
  </p>

  <p *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </p>
</div>
