<div class="login-container">
  <h2>Iniciar sesión</h2>

  <form (ngSubmit)="onLogin()" #f="ngForm">

    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" [(ngModel)]="credentials.email" required />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" [(ngModel)]="credentials.password" required />
    </div>

    <button type="submit" [disabled]="f.invalid || loading">
      {{ loading ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <p *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </p>

  <p class="register-link">
    ¿No tienes cuenta?
    <a routerLink="/register">Regístrate</a>
  </p>
</div>
